<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>팩트 폭탄 해체반 — 7라운드</title>
<style>
:root{--text:#17324d;--muted:#6b8297;--border:#dce6ee;--accent:#5b67e8;--fear:#ef6f63;--good:#38b779;--gen:#8d70e8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(135deg,#eefaff,#fbfbff 55%,#f7f4ff);color:var(--text)}
.wrap{max-width:760px;margin:auto;padding:16px}.shell{background:#ffffffef;border:1px solid #fff;border-radius:24px;padding:20px;box-shadow:0 18px 45px rgba(45,85,120,.12);margin-bottom:14px}.hidden{display:none!important}
h1{font-size:38px;line-height:1.04;margin:0 0 12px}.lead{color:var(--muted);line-height:1.6}label{font-weight:900}input{width:100%;margin-top:8px;border:1px solid var(--border);border-radius:14px;background:#f8fbfe;padding:13px;font-size:16px}
button{font-family:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:white;padding:14px 16px;font-weight:1000;font-size:16px;margin-top:12px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.pill{border:1px solid var(--border);border-radius:999px;padding:7px 12px;font-weight:900;background:#f8fbfe}
.bomb{width:168px;height:168px;margin:8px auto 18px;border-radius:50%;background:#252c36;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;border:8px solid #3d4753;box-shadow:inset 0 -18px 0 rgba(0,0,0,.18)}
.timer{font-size:34px;font-weight:900;letter-spacing:.08em}.statement{font-size:22px;line-height:1.45;font-weight:900;text-align:center;max-width:640px;margin:0 auto}.wire-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wire,.tool{min-height:68px;border-radius:18px;border:2px solid var(--border);background:#f8fbfe;font-weight:900;padding:12px;text-align:center;font-size:15px}.wire.correct,.tool.correct{outline:3px solid var(--good);background:#ecfaf3}.wire.wrong,.tool.wrong{outline:3px solid var(--fear);background:#fff2f0}
.center-title{text-align:center;font-weight:1000;margin:12px 0}.msg{min-height:56px;border-radius:14px;border:1px solid var(--border);background:#f8fbfe;padding:13px;text-align:center;font-weight:900;margin-top:12px}.boss{border:2px solid var(--gen)}.boss-label{font-weight:1000;text-align:center;font-size:18px;margin-bottom:6px}.shake{animation:shake .28s linear}.boom{animation:boom .38s ease}.result-badge{font-size:38px;font-weight:1000;line-height:1.05;text-align:center}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-box{border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;background:#f8fbfe}.result-box b{display:block;font-size:30px}.grade{border-radius:16px;background:#f0edff;padding:16px;text-align:center;font-size:20px;font-weight:1000}.rules{border:1px solid var(--border);border-radius:16px;padding:16px;line-height:1.8;background:#f8fbfe}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes boom{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@media(max-width:520px){.wire-grid,.tool-grid{grid-template-columns:1fr}.statement{font-size:19px}.wrap{padding:10px}.shell{padding:17px}}
</style></head>
<body><div id="gameRoot" class="wrap">
<section id="start" class="shell"><div style="font-size:13px;font-weight:1000;letter-spacing:.08em;color:var(--muted)">FACT BOMB SQUAD</div><h1>💣 팩트 폭탄 해체반</h1><p class="lead">총 <b>7라운드</b>. 공포·크기·일반화 폭탄을 해체하고 마지막 보스전까지 통과하세요.</p><label>모둠 이름<input id="team" placeholder="예: 진실추적단" maxlength="20"></label><button id="startBtn" class="primary" type="button">해체 작전 시작</button></section>
<section id="game" class="hidden"><div class="top"><div id="teamLabel" style="font-weight:1000"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill">점수 <span id="score">0</span></span><span class="pill">COMBO ×<span id="combo">1</span></span></div></div>
<div id="stage" class="shell"><div id="round" style="font-size:12px;font-weight:1000;color:var(--muted)">ROUND 1 / 7</div><div id="bossLabel" class="boss-label hidden">👑 FINAL BOSS</div><div id="bomb" class="bomb"><div style="font-size:13px;font-weight:1000">TIME</div><div id="time" class="timer">02:30</div></div><div id="statement" class="statement"></div></div>
<div id="wirePanel" class="shell"><div id="wireTitle" class="center-title">① 어떤 본능 폭탄인가?</div><div class="wire-grid"><button class="wire" data-kind="fear" type="button">🚨 공포 본능</button><button class="wire" data-kind="size" type="button">📊 크기 본능</button><button class="wire" data-kind="gen" type="button">🧩 일반화 본능</button></div></div>
<div id="toolPanel" class="shell hidden"><div id="toolTitle" class="center-title">② 어떤 도구로 해체할까?</div><div class="tool-grid"><button class="tool" data-tool="risk" type="button">🔍 실제 위험·노출 확인</button><button class="tool" data-tool="divide" type="button">➗ 비교하고 전체로 나누기</button><button class="tool" data-tool="examples" type="button">↔️ 더 많은 사례·반례 보기</button><button class="tool" data-tool="comments" type="button">💬 댓글 반응 확인</button></div></div><div id="message" class="msg"></div></section>
<section id="result" class="shell hidden"><div class="result-badge">🎉 FACT BOMB<br>DEFUSED</div><h2 id="finalTeam" style="text-align:center;margin-top:18px"></h2><div class="result-grid"><div class="result-box"><b id="finalScore">0</b>최종 점수</div><div class="result-box"><b id="finalCombo">×1</b>최고 콤보</div></div><div id="grade" class="grade" style="margin-top:12px"></div><div class="rules" style="margin-top:12px">🚨 공포 → <b>실제 위험·노출 확인</b><br>📊 크기 → <b>비교하고 전체로 나누기</b><br>🧩 일반화 → <b>더 많은 사례·반례 확인</b></div><button id="restart" class="primary" type="button">다시 도전</button></section>
</div>
<script>
(function(){const rounds=[
{text:'“비행기 사고 또 발생… 이제 하늘길도 안심할 수 없다!”',kind:'fear',tool:'risk',tip:'무서움과 실제 위험은 같지 않아요.'},
{text:'“감염병 기사 급증… 밖에 나가는 것 자체가 위험하다!”',kind:'fear',tool:'risk',tip:'실제 감염 가능성과 노출 수준을 확인해야 해요.'},
{text:'“학교폭력 신고 120건! 학교가 점점 위험해지고 있다.”',kind:'size',tool:'divide',tip:'전체 학생 수와 이전 수치를 비교해야 해요.'},
{text:'“조회 수 300만! 모두가 위험하다고 인정한 제품.”',kind:'size',tool:'divide',tip:'조회 수보다 결함률·판매량과 비교해야 해요.'},
{text:'“한 학생이 교사를 무시했다. 요즘 학생들은 예의가 없다.”',kind:'gen',tool:'examples',tip:'한 사례를 학생 전체로 확대하면 안 돼요.'},
{text:'“한 배달 기사가 늦었다. 배달 기사들은 책임감이 부족하다.”',kind:'gen',tool:'examples',tip:'더 많은 사례와 반대 사례를 확인해야 해요.'},
{text:'“무인 매장 절도 12건! 피해액 300만 원! 요즘 청소년은 정말 무섭다.”',boss:true,kinds:['fear','size','gen'],tools:['risk','divide','examples'],tip:'공포·큰 숫자·일반화가 한 기사에 동시에 숨어 있었어요!'}];
const root=document.getElementById('gameRoot'),start=document.getElementById('start'),game=document.getElementById('game'),result=document.getElementById('result'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),timeEl=document.getElementById('time'),roundEl=document.getElementById('round'),statement=document.getElementById('statement'),message=document.getElementById('message'),bomb=document.getElementById('bomb'),wirePanel=document.getElementById('wirePanel'),toolPanel=document.getElementById('toolPanel'),wireTitle=document.getElementById('wireTitle'),toolTitle=document.getElementById('toolTitle'),bossLabel=document.getElementById('bossLabel'),stage=document.getElementById('stage');
let idx=0,score=0,combo=1,maxCombo=1,time=150,timer=null,team='',phase='wire',locked=false,bossKinds=new Set(),bossTools=new Set();
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function resetButtons(){root.querySelectorAll('.wire,.tool').forEach(b=>b.classList.remove('correct','wrong'))}
function render(){const r=rounds[idx];roundEl.textContent=`ROUND ${idx+1} / ${rounds.length}`;statement.textContent=r.text;scoreEl.textContent=score;comboEl.textContent=combo;timeEl.textContent=fmt(time);resetButtons();locked=false;phase='wire';wirePanel.classList.remove('hidden');toolPanel.classList.add('hidden');bossLabel.classList.toggle('hidden',!r.boss);stage.classList.toggle('boss',!!r.boss);bossKinds.clear();bossTools.clear();if(r.boss){wireTitle.textContent='① 숨은 폭탄 3개를 모두 찾아라!';toolTitle.textContent='② 해체 도구 3개를 모두 작동시켜라!';message.textContent='👑 보스전! 세 본능이 모두 숨어 있습니다.'}else{wireTitle.textContent='① 어떤 본능 폭탄인가?';toolTitle.textContent='② 어떤 도구로 해체할까?';message.textContent='폭탄 종류를 골라 선을 잘라 보세요.'}}
function penalty(text,btn){btn.classList.add('wrong');bomb.classList.remove('shake');void bomb.offsetWidth;bomb.classList.add('shake');time=Math.max(0,time-10);timeEl.textContent=fmt(time);combo=1;comboEl.textContent=combo;message.textContent='💥 '+text+' -10초';setTimeout(()=>btn.classList.remove('wrong'),450)}
function nextRound(tip){locked=true;bomb.classList.remove('boom');void bomb.offsetWidth;bomb.classList.add('boom');const gain=100*combo;score+=gain;combo++;maxCombo=Math.max(maxCombo,combo-1);scoreEl.textContent=score;comboEl.textContent=combo;message.textContent=`✅ 해체 성공! +${gain}점 · ${tip}`;setTimeout(()=>{idx++;if(idx>=rounds.length)finish();else render()},1050)}
function finish(){clearInterval(timer);game.classList.add('hidden');result.classList.remove('hidden');document.getElementById('finalTeam').textContent=team+' 수사대';document.getElementById('finalScore').textContent=score;document.getElementById('finalCombo').textContent='×'+maxCombo;document.getElementById('grade').textContent=score>=1100?'🏆 S급 전설의 해체반':score>=800?'🥇 A급 팩트 요원':score>=550?'🥈 B급 진실 수사관':'🥉 C급 초보 요원'}
document.getElementById('startBtn').addEventListener('click',()=>{team=document.getElementById('team').value.trim();if(!team){document.getElementById('team').focus();return}start.classList.add('hidden');game.classList.remove('hidden');document.getElementById('teamLabel').textContent=team+' 수사대';idx=0;score=0;combo=1;maxCombo=1;time=150;render();timer=setInterval(()=>{if(time>0){time--;timeEl.textContent=fmt(time)}else finish()},1000)});
root.querySelectorAll('.wire').forEach(btn=>btn.addEventListener('click',()=>{if(locked||phase!=='wire')return;const r=rounds[idx];if(r.boss){if(r.kinds.includes(btn.dataset.kind)){if(!bossKinds.has(btn.dataset.kind)){bossKinds.add(btn.dataset.kind);btn.classList.add('correct');message.textContent=`✅ 폭탄 ${bossKinds.size}/3 발견!`;if(bossKinds.size===3){wirePanel.classList.add('hidden');toolPanel.classList.remove('hidden');phase='tool';message.textContent='🔥 세 폭탄 발견! 이제 해체 도구 3개를 작동시키세요.'}}}else penalty('잘못된 폭탄 선택!',btn)}else{locked=true;if(btn.dataset.kind===r.kind){btn.classList.add('correct');wirePanel.classList.add('hidden');toolPanel.classList.remove('hidden');phase='tool';locked=false;message.textContent='✅ 폭탄 발견! 이제 해체 도구를 고르세요.'}else{penalty('본능을 잘못 찾았어요!',btn);setTimeout(()=>locked=false,450)}}}));
root.querySelectorAll('.tool').forEach(btn=>btn.addEventListener('click',()=>{if(locked||phase!=='tool')return;const r=rounds[idx];if(r.boss){if(r.tools.includes(btn.dataset.tool)){if(!bossTools.has(btn.dataset.tool)){bossTools.add(btn.dataset.tool);btn.classList.add('correct');message.textContent=`✅ 해체 도구 ${bossTools.size}/3 작동!`;if(bossTools.size===3){score+=300;scoreEl.textContent=score;nextRound(r.tip)}}}else penalty('보스 해체에 필요 없는 도구!',btn)}else{locked=true;if(btn.dataset.tool===r.tool){btn.classList.add('correct');nextRound(r.tip)}else{penalty('해체 도구가 맞지 않아요!',btn);setTimeout(()=>locked=false,450)}}}));
document.getElementById('restart').addEventListener('click',()=>{clearInterval(timer);result.classList.add('hidden');start.classList.remove('hidden');document.getElementById('team').value=''})})();
</script></body></html>
